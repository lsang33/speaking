<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>姣忔棩璇?/title>
<style>
:root {
  --bg: #0c0c0e;
  --card: #18181c;
  --card2: #222228;
  --gold: #d4a843;
  --gold2: #f0c96a;
  --text: #f0eff4;
  --muted: #8b8a94;
  --red: #e05252;
  --green: #4caf6e;
  --r: 14px;
  /* semantic aliases */
  --border: #333;
  --border-light: #444;
  --divider: #222;
  --divider2: #2a2a30;
  --overlay: rgba(0,0,0,0.75);
  --overlay-heavy: rgba(0,0,0,0.9);
  --overlay-light: rgba(0,0,0,0.85);
  --gold-bg: rgba(212,168,67,0.08);
  --gold-bg2: rgba(212,168,67,0.15);
  --gold-bg3: rgba(212,168,67,0.06);
  --gold-bg4: rgba(212,168,67,0.12);
  --gold-border: rgba(212,168,67,0.2);
  --gold-border2: rgba(212,168,67,0.3);
  --green-bg: rgba(76,175,110,0.15);
  --green-bg2: rgba(76,175,110,0.12);
  --red-bg: rgba(229,115,115,0.12);
  --red-bg2: rgba(224,82,82,0.15);
  --on-accent: #000;
  --on-accent-inv: #fff;
  --code-bg: #15151e;
  --code-bg2: #1a1a2e;
  --code-bg3: #111;
  --muted-extra: #555;
  --muted-text2: #aaa;
  --muted-text3: #ccc;
  --toggle-track: #333;
  --toggle-thumb: #fff;
  --warn: #e0a030;
  --error-text: #e57373;
}
[data-theme="light"] {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card2: #eeeef2;
  --gold: #b8860b;
  --gold2: #d4a843;
  --text: #1a1a1e;
  --muted: #6e6d7a;
  --red: #d32f2f;
  --green: #388e3c;
  --border: #d0d0d8;
  --border-light: #c0c0c8;
  --divider: #e0e0e6;
  --divider2: #d8d8e0;
  --overlay: rgba(0,0,0,0.4);
  --overlay-heavy: rgba(0,0,0,0.6);
  --overlay-light: rgba(0,0,0,0.45);
  --gold-bg: rgba(184,134,11,0.08);
  --gold-bg2: rgba(184,134,11,0.12);
  --gold-bg3: rgba(184,134,11,0.06);
  --gold-bg4: rgba(184,134,11,0.1);
  --gold-border: rgba(184,134,11,0.25);
  --gold-border2: rgba(184,134,11,0.35);
  --green-bg: rgba(56,142,60,0.12);
  --green-bg2: rgba(56,142,60,0.1);
  --red-bg: rgba(211,47,47,0.1);
  --red-bg2: rgba(211,47,47,0.12);
  --on-accent: #fff;
  --on-accent-inv: #fff;
  --code-bg: #e8e8f0;
  --code-bg2: #e0e0ea;
  --code-bg3: #f0f0f4;
  --muted-extra: #999;
  --muted-text2: #777;
  --muted-text3: #555;
  --toggle-track: #d0d0d8;
  --toggle-thumb: #fff;
  --warn: #c4841a;
  --error-text: #c62828;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); }
body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--text);
  max-width: 430px;
  margin: 0 auto;
}

/* 鈹€鈹€ SCREENS 鈹€鈹€ */
.screen { display: none; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.screen.on { display: flex; }

/* 鈹€鈹€ TYPE 鈹€鈹€ */
h1 { font-size: 26px; font-weight: 700; line-height: 1.2; }
h2 { font-size: 20px; font-weight: 600; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .8px; color: var(--gold); text-transform: uppercase; }
.muted { color: var(--muted); font-size: 13px; line-height: 1.5; }

/* 鈹€鈹€ BUTTONS 鈹€鈹€ */
.btn {
  display: block; width: 100%; padding: 17px;
  border: none; border-radius: var(--r); font-size: 16px; font-weight: 600;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn:active { transform: scale(.97); opacity: .8; }
.btn-gold { background: var(--gold); color: var(--on-accent); }
.btn-ghost { background: var(--card2); color: var(--text); }
.btn-red { background: var(--red); color: var(--on-accent-inv); }
.btn-sm { padding: 11px 18px; font-size: 14px; border-radius: 10px; width: auto; }

/* 鈹€鈹€ INPUTS 鈹€鈹€ */
input[type=password], input[type=text] {
  width: 100%; padding: 15px 16px;
  background: var(--card2); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 16px;
}
input:focus { outline: none; border-color: var(--gold); }

/* 鈹€鈹€ CARDS 鈹€鈹€ */
.card { background: var(--card); border-radius: var(--r); padding: 18px; }
.topic-card {
  background: var(--card); border-radius: var(--r);
  border-left: 4px solid var(--gold); padding: 22px 20px;
}

/* 鈹€鈹€ STREAK 鈹€鈹€ */
.streak {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card2); padding: 7px 13px; border-radius: 20px;
  font-size: 14px; font-weight: 600;
}

/* 鈹€鈹€ TIMER 鈹€鈹€ */
#timer {
  font-size: 76px; font-weight: 200; letter-spacing: -3px;
  color: var(--gold); font-variant-numeric: tabular-nums;
}

/* 鈹€鈹€ REC DOT 鈹€鈹€ */
.rec { width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

/* 鈹€鈹€ TRANSCRIPT 鈹€鈹€ */
#tx-box {
  background: var(--card); border-radius: var(--r); padding: 16px;
  min-height: 110px; max-height: 190px; overflow-y: auto;
  font-size: 15px; line-height: 1.75; color: var(--muted-text3);
}

/* 鈹€鈹€ COUNTDOWN 鈹€鈹€ */
#cdnum {
  font-size: 130px; font-weight: 100; color: var(--gold);
  animation: pop .7s ease-out;
}
@keyframes pop { from { opacity:0; transform: scale(1.4); } to { opacity:1; transform: scale(1); } }

/* 鈹€鈹€ LOADER 鈹€鈹€ */
.spin {
  width: 42px; height: 42px; border-radius: 50%;
  border: 3px solid var(--card2); border-top-color: var(--gold);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 鈹€鈹€ EVAL BLOCKS 鈹€鈹€ */
.eval-block { background: var(--card); border-radius: 12px; padding: 14px 16px; }
.eval-block .label { display: block; margin-bottom: 6px; }
.eval-block p { font-size: 15px; line-height: 1.65; }
.eval-merged { background: var(--card); border-radius: 12px; padding: 14px 16px; }
.eval-sect + .eval-sect { border-top: 1px solid var(--divider); margin-top: 12px; padding-top: 12px; }
.eval-sect .label { display: block; margin-bottom: 6px; }
.eval-sect p { font-size: 15px; line-height: 1.65; margin: 0; }

/* 鈹€鈹€ SCORE 鈹€鈹€ */
.score-ring {
  width: 72px; height: 72px; border-radius: 50%;
  border: 2.5px solid var(--gold);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.score-n { font-size: 26px; font-weight: 700; color: var(--gold); line-height: 1; }
.score-d { font-size: 11px; color: var(--muted); }

/* 鈹€鈹€ HISTORY 鈹€鈹€ */
.hist-item { background: var(--card); border-radius: 12px; padding: 13px 15px; }
.hist-header { display: flex; align-items: flex-start; cursor: pointer; gap: 10px; }
.hist-detail { display: none; }
.hist-detail.open { display: block; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--divider2); }
.theme-badge {
  display: inline-block; padding: 2px 8px; border-radius: 20px;
  font-size: 10px; font-weight: 700; letter-spacing: .4px;
  background: var(--card2); color: var(--gold);
}
.stat-box { flex: 1; background: var(--card2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.stat-n { font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1; }
.stat-l { font-size: 11px; color: var(--muted); margin-top: 4px; }
.filter-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
#topics-tab-bar { overflow-x: visible; flex-wrap: wrap; padding-bottom: 0; position: sticky; top: 0; background: var(--bg); z-index: 10; padding-top: 6px; margin: -6px -20px 0; padding-left: 20px; padding-right: 20px; }
.topics-main-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.topics-main-tab {
  flex: 1; padding: 10px 8px; border-radius: 8px; text-align: center;
  border: none; font-size: 13px; font-weight: 600; cursor: pointer;
  background: var(--card2); color: var(--muted); transition: all .15s;
}
.topics-main-tab.active { background: var(--gold); color: var(--on-accent); }
.topics-sub-filter { gap: 6px; padding-bottom: 10px; flex-wrap: wrap; display: flex; }
.filter-btn {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  border: none; font-size: 13px; cursor: pointer;
  background: var(--card2); color: var(--muted);
}
.filter-btn.active { background: var(--gold); color: var(--on-accent); font-weight: 600; }
.audio-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
.audio-btn {
  background: var(--card2); border: none; border-radius: 8px;
  color: var(--text); font-size: 13px; padding: 7px 14px;
  cursor: pointer; flex-shrink: 0; transition: opacity .15s;
}
.audio-btn:active { opacity: .7; }
.audio-progress { flex: 1; height: 20px; display: flex; align-items: center; cursor: pointer; position: relative; }
.audio-progress-track { width: 100%; height: 4px; background: var(--divider2); border-radius: 2px; overflow: hidden; pointer-events: none; }
.audio-progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width .3s linear; }
.del-audio-btn {
  background: none; border: none; color: var(--red); font-size: 12px;
  cursor: pointer; padding: 4px 0; flex-shrink: 0;
}

/* 鈹€鈹€ SETTINGS 鈹€鈹€ */
#cfg-enable-optimize:checked + span { background: var(--gold) !important; }
#cfg-enable-optimize:checked + span::after { transform: translateY(-50%) translateX(18px); }
#cfg-enable-highscore:checked + span { background: var(--gold) !important; }
#cfg-enable-highscore:checked + span::after { transform: translateY(-50%) translateX(18px); }
#cfg-interview-twostage:checked + span { background: var(--gold) !important; }
#cfg-interview-twostage:checked + span::after { transform: translateY(-50%) translateX(18px); }
#cfg-enable-think-model:checked + span { background: var(--gold) !important; }
#cfg-enable-think-model:checked + span::after { transform: translateY(-50%) translateX(18px); }
#cfg-eval-thinking:checked + span { background: var(--gold) !important; }
#cfg-eval-thinking:checked + span::after { transform: translateY(-50%) translateX(18px); }
#optimize-toggle-track::after { content:''; position:absolute; left:4px; top:50%; transform:translateY(-50%); width:18px; height:18px; border-radius:50%; background:var(--toggle-thumb); transition:.2s; }
.type-btn {
  flex: 1; padding: 11px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--card2);
  color: var(--muted); font-size: 14px; cursor: pointer; transition: all .15s;
}
.type-btn.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 600; }
.preset-btn {
  padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card2); color: var(--text); font-size: 13px; cursor: pointer;
}
.preset-btn:active { opacity: .7; }
.preset-btn.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 600; }
.settings-icon {
  background: none; border: none; color: var(--muted);
  font-size: 19px; cursor: pointer; padding: 6px; line-height: 1;
}

/* 鈹€鈹€ METRICS 鈹€鈹€ */
.metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.metric-item { background: var(--card2); border-radius: 8px; padding: 10px 6px; text-align: center; }
.metric-val { font-size: 20px; font-weight: 700; color: var(--gold); line-height: 1; }
.metric-val.ok { color: var(--green); }
.metric-val.warn { color: var(--warn); }
.metric-val.bad { color: var(--red); }
.metric-label { font-size: 10px; color: var(--muted); margin-top: 3px; }
.metric-hint { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* 鈹€鈹€ WORD MODE 鈹€鈹€ */
.word-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 24px;
  border: 1.5px solid var(--border-light); background: var(--card2);
  font-size: 18px; font-weight: 600; color: var(--text);
  transition: all .3s;
}
.word-chip.hit {
  border-color: var(--green); background: var(--green-bg);
  color: var(--green);
}
.word-chip .check { display: none; font-size: 14px; }
.word-chip.hit .check { display: inline; }
.word-chips-row {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; padding: 4px 0;
}
/* big word display on ready screen */
.word-chip-big {
  display: inline-flex; align-items: center;
  padding: 14px 24px; border-radius: 28px;
  border: 2px solid var(--gold); background: var(--gold-bg);
  font-size: 22px; font-weight: 700; color: var(--gold);
}
/* rec screen word overlay */
#rec-words-bar {
  display: none; background: var(--card); border-radius: 12px; padding: 10px 12px;
}
/* word count toggle chips */
.wc-btn {
  padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card2); color: var(--muted); font-size: 14px; cursor: pointer; transition: all .15s;
}
.wc-btn.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 600; }

/* 鈹€鈹€ UTILS 鈹€鈹€ */
.flex { display: flex; }
.col { flex-direction: column; }
.gap-8 { gap: 8px; }
.gap-18 { gap: 18px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }
.gap-20 { gap: 20px; }
.mt-auto { margin-top: auto; }
.center { align-items: center; justify-content: center; text-align: center; }
.between { justify-content: space-between; align-items: center; }
.hint { background: var(--card2); border-radius: 10px; padding: 13px 15px; font-size: 13px; line-height: 1.65; color: var(--muted); }

/* 鈹€鈹€ EXPANSION MODE 鈹€鈹€ */
.exp-source-card {
  background: var(--card); border-radius: var(--r); padding: 18px;
  cursor: pointer; transition: opacity .15s;
  border: 1.5px solid transparent;
}
.exp-source-card:active { opacity: .7; }
.exp-source-card.selected { border-color: var(--gold); }
.exp-source-icon { font-size: 28px; margin-bottom: 6px; }
#exp-arg-text {
  font-size: 20px; font-weight: 700; line-height: 1.4; color: var(--gold);
  text-align: center; padding: 16px 12px;
  background: var(--gold-bg); border-radius: 12px;
  border: 1px solid var(--gold-border);
}
#exp-dirs { display: flex; flex-direction: column; gap: 8px; }
.exp-dir-item {
  font-size: 13px; color: var(--muted); line-height: 1.5;
  padding: 10px 14px; background: var(--card2); border-radius: 10px;
  border-left: 2px solid var(--gold);
}
#exp-rec-bar {
  display: none; background: var(--card); border-radius: 12px; padding: 10px 12px;
  margin-bottom: 4px;
}
#exp-rec-bar .exp-rec-arg {
  font-size: 14px; font-weight: 600; color: var(--gold); line-height: 1.3;
  margin-bottom: 6px;
}
#exp-rec-bar .exp-rec-dir {
  font-size: 10px; color: var(--muted); line-height: 1.4;
}
#exp-dur-options { display: flex; gap: 8px; justify-content: center; }
.exp-dur-btn {
  padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card2); color: var(--muted); font-size: 14px; cursor: pointer;
}
.exp-dur-btn.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 600; }
.exp-domain-chip, .exp-diff-chip {
  padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card2); color: var(--muted); font-size: 12px; cursor: pointer;
}
.exp-domain-chip.active, .exp-diff-chip.active { background: var(--gold); color: var(--on-accent); border-color: var(--gold); font-weight: 600; }
.exp-theme-chip {
  display: block; width: 100%; padding: 14px 16px; border-radius: 10px;
  border: 1.5px solid var(--border); background: var(--card2); color: var(--text);
  font-size: 15px; font-weight: 500; cursor: pointer; text-align: left;
  transition: all .15s;
}
.exp-theme-chip .theme-chip-sub { font-size: 12px; color: var(--muted); font-weight: 400; }
.exp-theme-chip:active { opacity: .7; }
.exp-theme-chip.active { border-color: var(--gold); background: var(--gold-bg); }
.exp-fixed-arg-item {
  padding: 12px 14px; background: var(--card2); border-radius: 10px; cursor: pointer;
  border: 1.5px solid transparent; transition: all .15s;
}
.exp-fixed-arg-item:active { opacity: .7; }
.exp-fixed-arg-item:hover { border-color: var(--border-light); }
.exp-fixed-arg-summary { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.exp-fixed-arg-preview { font-size: 12px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#exp-claim-list { display: flex; flex-direction: column; gap: 8px; }
.exp-claim-item {
  padding: 14px; background: var(--card2); border-radius: 10px; cursor: pointer;
  font-size: 15px; font-weight: 500; line-height: 1.4;
  border: 1.5px solid transparent; transition: all .15s;
}
.exp-claim-item:active { opacity: .7; }
.exp-claim-item.selected { border-color: var(--gold); background: var(--gold-bg); }
.exp-source-badge {
  display: inline-block; font-size: 11px; font-weight: 700;
  color: var(--gold); background: var(--gold-bg4);
  padding: 1px 6px; border-radius: 4px; margin-left: 6px;
  vertical-align: middle;
}
#exp-topics-list.collapsed { max-height: 26vh; overflow-y: auto; }
#exp-claims-panel { margin-top: 4px; border-top: 2px solid var(--gold-border); padding-top: 14px; }
.exp-loading {
  display: flex; align-items: center; gap: 10px; padding: 20px 0;
  color: var(--muted); font-size: 14px;
}
#exp-vocab-upgrade { font-size: 13px; line-height: 1.6; }
#exp-vocab-upgrade .vu-row {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 0;
  border-bottom: 1px solid var(--divider);
}
#exp-vocab-upgrade .vu-from { color: var(--red); text-decoration: line-through; font-size: 13px; }
#exp-vocab-upgrade .vu-arrow { color: var(--muted); font-size: 11px; }
#exp-vocab-upgrade .vu-to { color: var(--green); font-weight: 600; font-size: 13px; }
#exp-vocab-upgrade .vu-reason { color: var(--muted); font-size: 11px; margin-left: auto; }
#exp-compare {
  background: var(--card); border-radius: 12px; padding: 14px 16px;
}
#exp-compare .exp-original {
  font-size: 13px; color: var(--muted); line-height: 1.65;
  padding: 10px; background: var(--card2); border-radius: 8px; margin-bottom: 10px;
}
#exp-compare .exp-model {
  font-size: 14px; color: var(--text); line-height: 1.75;
  padding: 10px; background: var(--gold-bg3); border-radius: 8px;
  border-left: 3px solid var(--gold);
}

/* 鈹€鈹€ CALENDAR 鈹€鈹€ */
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
.cal-nav { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 8px; line-height:1; }
.cal-nav:active { opacity:.6; }
.cal-month-label { font-size:13px; font-weight:600; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
.cal-weekday { text-align:center; font-size:9px; color:var(--muted); padding:3px 0; font-weight:600; }
.cal-day { text-align:center; padding:3px 1px 2px; border-radius:4px; font-size:11px; min-height:26px; display:flex; flex-direction:column; align-items:center; gap:2px; }
.cal-day.other-month { opacity:.3; }
.cal-day-num { line-height:1; }
.cal-day.today .cal-day-num { color:var(--gold); font-weight:700; }
.cal-day.has-record { cursor:pointer; }
.cal-day.has-record:active { background:var(--card2); }
.cal-dot { width:4px; height:4px; border-radius:50%; background:var(--gold); }

function initTheme() {
  const stored = localStorage.getItem('theme');
  if (stored === 'light' || stored === 'dark') {
    document.documentElement.setAttribute('data-theme', stored);
  } else {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  }
  updateThemeIcon();
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon();
}
function updateThemeIcon() {

}

let audioDB = null;
function openAudioDB() {
  return new Promise((resolve, reject) => {
    if (audioDB) { resolve(audioDB); return; }
    const req = indexedDB.open('ks_audio', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('recs');
    req.onsuccess = e => { audioDB = e.target.result; resolve(audioDB); };
    req.onerror = () => reject(req.error);
  });
}
async function saveAudio(id, blob) {
  const db = await openAudioDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('recs', 'readwrite');
    tx.objectStore('recs').put(blob, id);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

    const tx = db.transaction('recs', 'readonly');

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

}

function computeStreak() {
  const dates = [...new Set(S.history.map(h => h.date))].sort().reverse();
  if (!dates.length) { S.streak = 0; return; }
  const td = today();
  let streak = dates[0] === td ? 1 : 0;
  const base = new Date();
  if (dates[0] !== td) base.setDate(base.getDate() - 1);
  for (let i = streak ? 1 : 0; i < dates.length; i++) {
    base.setDate(base.getDate() - 1);
    if (dates[i] === dateStr(base)) streak++;
    else break;
  }
  S.streak = streak;
}

function computeLongestStreak() {
  const dates = [...new Set(S.history.map(h => h.date))].sort();
  if (!dates.length) return 0;
  let longest = 1, current = 1;
  for (let i = 1; i < dates.length; i++) {
    const prev = new Date(dates[i-1]);
    const curr = new Date(dates[i]);
    const diff = (curr - prev) / (1000 * 60 * 60 * 24);
    if (diff === 1) { current++; longest = Math.max(longest, current); }
    else current = 1;
  }
  return longest;
}

    // 钖勫急涓婚鍔犳潈
    const stat = themeStats[t.theme];
    if (stat && stat.count > 0) {
      const avg = stat.sum / stat.count;
      if (avg < 7) {
        score += Math.round((7 - avg) * 5);
        reasons.push(`${t.theme}鍧囧垎鍋忎綆锛?{avg.toFixed(1)}鍒嗭級`);
      }
    }

    // 鏈秹鍙婄殑涓婚
    if (!themeStats[t.theme]) { score += 12; reasons.push(`${t.theme}杩樻湭娑夊強`); }

    // 鏈€杩戠粌杩囩殑涓婚闄嶆潈
    if (recentThemes.includes(t.theme)) score -= 15;

    return { topic: t, score, reason: reasons[0] || '' };
  });

  candidates.sort((a, b) => b.score - a.score);
  // 浠庡墠3鍚嶉殢鏈洪€変竴涓紝閬垮厤姣忔瀹屽叏涓€鏍?
  const pick = candidates[Math.floor(Math.random() * Math.min(3, candidates.length))];
  return { topic: pick.topic, reason: pick.reason };
}

function renderHistChart() {

  if (data.length < 2) { wrap.style.display = 'none'; return; }

  const W = (svg.parentElement.offsetWidth || 350);
  const H = 72;
  const pad = { t: 16, b: 8, l: 4, r: 4 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const n = data.length;
  const scores = data.map(s => parseInt(s.score));
  const pts = scores.map((v, i) => ({
    x: pad.l + (i / (n - 1)) * iW,
    y: pad.t + (1 - v / 10) * iH,
  }));
  const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <polyline points="${polyline}" fill="none" stroke="var(--gold)" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i === n-1 ? 4 : 2.5}"

function highlightSlips(transcript, evaluation, metrics) {
  if (!transcript) return transcript;
  try {
  let result = transcript;

  // 鍙ｈ楂樹寒锛堥噾鑹诧紝鍙爣绗竴娆″嚭鐜帮級
  if (evaluation) {
    const m = evaluation.match(/\*\*鍙ｈ鏍囪\*\*[锛?]([\s\S]*?)(?=\*\*|$)/);
    if (m) {
      const slipText = m[1].trim();
      if (slipText && slipText !== '鏃?) {
        const re = /銆?[^銆峕+)銆?g;
        let match;
        while ((match = re.exec(slipText)) !== null) {
          const phrase = match[1];
          if (phrase.length < 2) continue;
          const st = 'color:var(--gold);background:var(--gold-bg2);border-radius:3px;padding:0 2px;';
          let found = false;
          result = result.replace(/(<[^>]+>)|([^<]+)/g, (seg, tag, text) => {
            if (tag) return tag;
            if (found) return text;
            const idx = text.indexOf(phrase);
            if (idx < 0) return text;
            found = true;
            return text.slice(0, idx) + `<span style="${st}">${phrase}</span>` + text.slice(idx + phrase.length);
          });
        }
      }
    }
  }

  // 鍙ｅご绂呴珮浜紙绾㈣壊锛夛紝璺宠繃宸叉湁 span 鍐呴儴
  if (metrics?.fillerCounts) {
    const st = 'color:var(--error-text);background:var(--red-bg);border-radius:3px;padding:0 2px;';
    Object.keys(metrics.fillerCounts).forEach(word => {
      result = result.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) =>
        tag ? tag : text.split(word).join(`<span style="${st}">${word}</span>`)
      );
    });
  }

  return result;
  } catch(e) { return transcript; }
}

function parseEvalSections(evalText) {
  if (!evalText) return [];
  const keys = [
    { k: '鍙欎簨缁撴瀯', icon: '馃摉' },
    { k: '缁嗚妭鐢熷姩鎬?, icon: '馃帹' },
    { k: '璇嶈涓茶仈', icon: '馃敆' },
    { k: '閫昏緫缁撴瀯', icon: '馃З' },
    { k: '璇█娴佺晠搴?, icon: '馃棧' },

    { k: '鏄庢棩鑱氱劍', icon: '馃幆' },
    { k: '鍙ｈ鏍囪', icon: '馃攳' },
    { k: '璇勫垎鐞嗙敱', icon: '馃挰' },
  ];
  return keys.map(({ k, icon }) => {
    const m = evalText.match(new RegExp(`\\*\\*${k}\\*\\*[锛?]([\\s\\S]*?)(?=\\*\\*|$)`));
    return m ? { k, icon, text: m[1].trim() } : null;
  }).filter(Boolean);
}

   LLM CALL
鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?*/
async function callLLM(prompt, maxTokens = 800, useThinkModel = false, disableThinking = false) {
  const type = S.apiType || 'anthropic';
  const key = S.apiKey;
  const baseModel = S.apiModel || (type === 'anthropic' ? 'claude-haiku-4-5' : '');
  const model = (useThinkModel && S.enableThinkModel && S.thinkModel) ? S.thinkModel : baseModel;
  const baseUrl = (S.apiUrl || '').replace(/\/$/, '');

  const maxRetries = 2;

  if (type === 'openai') {
    let lastErr;
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      let res;
      try {
        res = await fetch(`${baseUrl}/v1/chat/completions`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`,
          },
          body: JSON.stringify({
            model,
            max_tokens: maxTokens,
            messages: [{ role: 'user', content: prompt }],
            ...(disableThinking ? { thinking: { type: 'disabled' } } : {}),
          }),
        });
      } catch (e) {
        lastErr = e;
        if (attempt < maxRetries && (e instanceof TypeError)) {
          await new Promise(r => setTimeout(r, 1500));
          continue;
        }
        throw e;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      const msg = data.choices?.[0]?.message;
      S.debugLastDiag = {
        finish_reason: data.choices?.[0]?.finish_reason || '?',
        contentLen: (msg?.content || '').length,
        reasoningLen: (msg?.reasoning_content || '').length,
      };

      // 1. Try content field, stripping think blocks
      const rawContent = msg?.content || '';
      let content = rawContent.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
      if (content.includes('<think>')) content = content.replace(/<think>[\s\S]*/gi, '').trim();
      if (content) return content;

      // 2. Fallback: extract formatted answer from reasoning_content
      const reasoning = msg?.reasoning_content || '';
      if (reasoning) {
        const m = reasoning.search(/\*\*(閫昏緫缁撴瀯|鍙欎簨缁撴瀯|璇嶈涓茶仈|璇█娴佺晠搴?[锛?]/);
        if (m !== -1) return reasoning.slice(m).trim();
      }
      return '';
    }
    throw lastErr;
  } else {
    let lastErr;
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      let res;
      try {
        res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model,
            max_tokens: maxTokens,
            messages: [{ role: 'user', content: prompt }],
          }),
        });
      } catch (e) {
        lastErr = e;
        if (attempt < maxRetries && (e instanceof TypeError)) {
          await new Promise(r => setTimeout(r, 1500));
          continue;
        }
        throw e;
      }
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }
      const data = await res.json();
      return data.content?.find(b => b.type === 'text')?.text || '';
    }
    throw lastErr;
  }
}

function drawWords(n) {
  const pool = [...WORD_BANK];
  const picked = [];
  for (let i = 0; i < n && pool.length; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}

      realQs.forEach(t => {

async function expSelectTopic(idx, forceRefresh = false) {
  const t = INTERVIEW_TOPICS[idx];
  _expState.sourceTopic = { text: t.text, subtype: t.subtype };
  // 鏀惰捣棰樼洰鍒楄〃锛屼负璁虹偣鑵剧┖闂?

  if (!forceRefresh && _expClaimsCache[idx]) {
    _expClaimsCache._lastIdx = idx;
    document.getElementById('exp-refresh-claims-btn').style.display = '';
    document.getElementById('exp-claim-list').innerHTML = _expClaimsCache[idx].map((c, i) => {
      const escaped = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return `<div class="exp-claim-item" data-claim="${escaped.replace(/'/g,'&#39;')}" onclick="expPickClaim(this.dataset.claim, this)">${escaped}</div>`;
    }).join('');
    return;
  }
  _expClaimsCache._lastIdx = idx;
  // 娓呴櫎鏃х紦瀛橈紙鍙繚鐣欏綋鍓嶉锛?
  _expClaimsCache = { _lastIdx: idx };
  // 鏄剧ず鍔犺浇
  document.getElementById('exp-refresh-claims-btn').style.display = 'none';
  document.getElementById('exp-claims-loading').style.display = 'flex';
  document.getElementById('exp-claim-list').innerHTML = '';

  const prompt = `浠庝互涓嬮潰璇曢涓彁鍙?2-3 涓牳蹇冭鐐广€傛瘡涓鐐逛竴鍙ヨ瘽锛?5-30瀛楋級锛屾湁瑙傜偣鎬佸害锛屼笉鏄簨瀹為檲杩般€傝繖鏄潰璇曞彛澶磋〃杈剧敤鐨勮鐐癸紝璇█瑕佽嚜鐒剁洿鎺ワ紝涓嶈鐢宠/鍏枃璇嶆眹锛堝"瀹屽杽...鏈哄埗""鏋勫缓...浣撶郴""寮哄寲...鎶撴墜"锛夈€備笉瑕佺紪鍙凤紝姣忚涓€涓鐐广€?

棰樼洰锛?{t.subtype}锛夛細${t.text}`;

  try {
    const result = await callLLM(prompt, 800);
    const claims = result.split('\n').map(s => s.replace(/^[\d\.\-\s鈥?]+/, '').trim()).filter(s => s.length >= 8 && s.length <= 60);
    if (!claims.length) throw new Error('璁虹偣鎻愬彇缁撴灉涓虹┖');
    _expClaimsCache[idx] = claims;
    document.getElementById('exp-claim-list').innerHTML = claims.map((c, i) => {
      const escaped = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return `<div class="exp-claim-item" data-claim="${escaped.replace(/'/g,'&#39;')}" onclick="expPickClaim(this.dataset.claim, this)">${escaped}</div>`;
    }).join('');
    document.getElementById('exp-refresh-claims-btn').style.display = '';
  } catch(e) {
    document.getElementById('exp-claim-list').innerHTML = `<div class="muted" style="color:var(--red);font-size:13px;">鎻愬彇澶辫触锛?{e.message}</div>`;
  } finally {
    document.getElementById('exp-claims-loading').style.display = 'none';
  }

async function acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;

    S._wakeLock = await navigator.wakeLock.request('screen');
    S._wakeLock.addEventListener('release', () => { S._wakeLock = null; });

}
function releaseWakeLock() {

}

function startMediaRecorder() {
  if (!window.MediaRecorder || !navigator.mediaDevices) {
    showMicError({ name: 'NoMediaDevices', message: '姝ゆ祻瑙堝櫒涓嶆敮鎸?MediaRecorder/mediaDevices銆傝浣跨敤鏈€鏂?Chrome銆丒dge 鎴?Firefox锛屽苟纭繚閫氳繃 HTTPS 璁块棶銆? });
    return;
  }
  acquireWakeLock();
  const streamPromise = S._permStream
    ? Promise.resolve(S._permStream)
    : navigator.mediaDevices.getUserMedia({ audio: true });
  S._permStream = null;
  streamPromise.then(stream => {
    const mimeType = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', '']
      .find(t => t === '' || MediaRecorder.isTypeSupported(t));
    const mr = new MediaRecorder(stream, mimeType ? { mimeType } : {});
    S.audioChunks = [];
    S.mediaStream = stream;
    mr.ondataavailable = e => { if (e.data.size > 0) S.audioChunks.push(e.data); };
    mr.start(1000);
    S.mediaRecorder = mr;

    // Real-time silence detection via AnalyserNode
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        const ctx = new AC();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        const buf = new Float32Array(analyser.fftSize);

        // Calibration: collect first 300ms of RMS to set dynamic threshold
        const calibSamples = [];
        let threshold = 0.01; // fallback default
        let calibDone = false;

        // Pause tracking state
        let silStart = null;       // timestamp when silence began
        const MIN_PAUSE_MS = S.pauseThresh || 1000;
        const rmsWindow = [];      // rolling RMS for volume CV
        let pauses = [];

        S._analyserCtx = ctx;
        S._analyserTimer = setInterval(() => {
          analyser.getFloatTimeDomainData(buf);
          const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length);

          if (!calibDone) {
            calibSamples.push(rms);
            if (calibSamples.length >= 3) { // ~300ms
              const peak = Math.max(...calibSamples);
              threshold = Math.max(peak * 0.15, 0.008);
              calibDone = true;
            }
            return;
          }

          rmsWindow.push(rms);

          const isSilent = rms < threshold;
          const now = Date.now();
          if (isSilent) {
            if (silStart === null) silStart = now;
          } else {
            if (silStart !== null) {
              const dur = now - silStart;
              if (dur >= MIN_PAUSE_MS) pauses.push(+(dur / 1000).toFixed(1));
              silStart = null;
            }
          }
        }, 100);

        S._getRealtimeMetrics = () => {
          // flush any in-progress silence
          if (silStart !== null) {
            const dur = Date.now() - silStart;
            if (dur >= MIN_PAUSE_MS) pauses.push(+(dur / 1000).toFixed(1));
          }
          const speech = rmsWindow.filter(r => r >= threshold);
          const mean = speech.reduce((a, b) => a + b, 0) / (speech.length || 1);
          const std = Math.sqrt(speech.reduce((s, v) => s + (v - mean) ** 2, 0) / (speech.length || 1));
          const cv = mean > 0 ? +(std / mean).toFixed(2) : 0;
          return {
            pauseCount: pauses.length,
            totalPauseSec: +pauses.reduce((a, b) => a + b, 0).toFixed(1),
            longestPause: pauses.length ? +Math.max(...pauses).toFixed(1) : 0,
            volumeCV: cv,
            pauses,
          };
        };
      }
    } catch(e) { /* AudioContext unavailable, skip real-time metrics */ }
  }).catch(err => {
    showMicError(err);
  });
}

const FILLERS = ['鍡?,'鍟?,'鍝?,'鍛?,'灏辨槸','閭ｄ釜','杩欎釜','鐒跺悗','瀵瑰惂','鏄惂','瀵逛笉瀵?,'鏄笉鏄?];
// 姝ｅ父鍙犺瘝鐧藉悕鍗曪紝涓嶈涓洪噸澶嶅彛璇?
const REPEAT_WHITELIST = new Set(['鍒氬垰','甯稿父','鎱㈡參','鐪嬬湅','鎯虫兂','璇磋','璇曡瘯','璧拌蛋','鑱婅亰','璋㈣阿','濂藉ソ','澶氬','蹇揩','杞昏交','闈欓潤','榛橀粯','鎮勬倓','娓愭笎','娓愭笎','鍋跺皵','濡堝','鐖哥埜','鍝ュ摜','濮愬','寮熷紵','濡瑰','瀹濆疂','濞冨▋','鏄熸槦','鐐圭偣','鏃舵椂','澶勫','浜嬩簨','浜轰汉','瀹跺','澶╁ぉ','骞村勾','鏃ユ棩','鏈嬪弸鏈嬪弸']);

function analyzeTranscript(transcript, duration) {
  const fillerCounts = {};
  let totalFillers = 0;
  FILLERS.forEach(w => {
    const n = (transcript.match(new RegExp(w, 'g')) || []).length;
    if (n > 0) { fillerCounts[w] = n; totalFillers += n; }
  });
  // Chinese character count only
  const chars = (transcript.match(/[\u4e00-\u9fff]/g) || []).length;
  const pace = duration > 0 ? Math.round(chars / duration * 60) : 0;
  const sentences = transcript.split(/[銆傦紒锛熲€/).filter(s => s.replace(/\s/g,'').length > 3).length;

  // 閲嶅璇嶆娴嬶細1~4涓眽瀛楃揣鎺ラ噸澶嶏紝鎺掗櫎鐧藉悕鍗曞彔璇?
  const repeatCounts = {};
  let totalRepeats = 0;
  const repeatRe = /([\u4e00-\u9fff]{1,4})\1/g;
  let m;
  while ((m = repeatRe.exec(transcript)) !== null) {
    const word = m[1];
    if (!REPEAT_WHITELIST.has(word + word) && !REPEAT_WHITELIST.has(word)) {
      repeatCounts[word] = (repeatCounts[word] || 0) + 1;
      totalRepeats++;
    }
  }

  return { fillerCounts, totalFillers, chars, pace, sentences, repeatCounts, totalRepeats };
}

async function analyzeAudioBlob(blob) {
  if (!blob || !window.AudioContext && !window.webkitAudioContext) return null;
  try {
    const arrayBuffer = await blob.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
    await ctx.close();

    const data = audioBuffer.getChannelData(0);
    const sr = audioBuffer.sampleRate;
    const winSize = Math.floor(sr * 0.1); // 100ms windows

    // RMS per window
    const rmsArr = [];
    for (let i = 0; i < data.length; i += winSize) {
      const slice = data.subarray(i, Math.min(i + winSize, data.length));
      const rms = Math.sqrt(slice.reduce((s, v) => s + v * v, 0) / slice.length);
      rmsArr.push(rms);
    }

    // Dynamic silence threshold: 5% of peak
    const peak = Math.max(...rmsArr);
    const threshold = Math.max(peak * 0.05, 0.003);
    const MIN_WIN = 5; // 0.5s minimum pause

    // Detect pauses
    let pauses = [], silStart = -1;
    rmsArr.forEach((rms, i) => {
      if (rms < threshold) {
        if (silStart === -1) silStart = i;
      } else if (silStart !== -1) {
        const len = i - silStart;
        if (len >= MIN_WIN) pauses.push(+(len * 0.1).toFixed(1));
        silStart = -1;
      }
    });

    // Volume variation: coefficient of variation on speech windows
    const speech = rmsArr.filter(r => r >= threshold);
    const mean = speech.reduce((a, b) => a + b, 0) / (speech.length || 1);
    const std = Math.sqrt(speech.reduce((s, v) => s + (v - mean) ** 2, 0) / (speech.length || 1));
    const cv = mean > 0 ? std / mean : 0;

    return {
      pauseCount: pauses.length,
      totalPauseSec: +pauses.reduce((a, b) => a + b, 0).toFixed(1),
      longestPause: pauses.length ? +Math.max(...pauses).toFixed(1) : 0,
      volumeCV: +cv.toFixed(2), // 0=鍗曡皟, >0.5=鍙樺寲涓板瘜
    };

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function audioExt(blob) {
  return blob.type.includes('mp4') ? 'mp4' : 'webm';
}

  if (!blob) { alert('璇ヨ褰曟病鏈夊綍闊虫枃浠?); return; }

}

鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?*/
let currentPlayingId = null;

function seekAudio(id, event) {
  const audioEl = document.getElementById(`ael-${id}`);
  if (!audioEl || !audioEl.duration) return;
  const container = event.currentTarget;
  const rect = container.getBoundingClientRect();
  const clientX = event.changedTouches ? event.changedTouches[0].clientX : event.clientX;
  const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const prog = document.getElementById(`aprog-${id}`);
  if (prog) { prog.style.transition = 'none'; prog.style.width = (pct * 100) + '%'; setTimeout(() => prog.style.transition = '', 50); }
  audioEl.currentTime = pct * audioEl.duration;
}

async function toggleAudio(id) {
  const btn = document.getElementById(`abtn-${id}`);
  const audioEl = document.getElementById(`ael-${id}`);
  const prog = document.getElementById(`aprog-${id}`);
  const timeEl = document.getElementById(`atime-${id}`);

  // Pause if already playing this one
  if (currentPlayingId === id && !audioEl.paused) {
    audioEl.pause();
    btn.textContent = '鈻?鎾斁褰曢煶';
    currentPlayingId = null;
    return;
  }

  // Stop whatever else is playing
  if (currentPlayingId && currentPlayingId !== id) {
    const prev = document.getElementById(`ael-${currentPlayingId}`);
    const prevBtn = document.getElementById(`abtn-${currentPlayingId}`);
    if (prev) prev.pause();
    if (prevBtn) prevBtn.textContent = '鈻?鎾斁褰曢煶';
    currentPlayingId = null;
  }

  // Resume if already loaded but paused
  if (audioEl.src && audioEl.paused && audioEl.readyState >= 2) {
    await audioEl.play();
    btn.textContent = '鈴?鏆傚仠';
    currentPlayingId = id;
    return;
  }

  btn.textContent = '鍔犺浇涓€?;
  btn.disabled = true;
  try {
    const blob = await getAudio(id);
    if (!blob) { btn.textContent = '褰曢煶涓嶅瓨鍦?; btn.disabled = false; return; }

    const url = URL.createObjectURL(blob);
    audioEl.src = url;

    audioEl.ontimeupdate = () => {
      if (!audioEl.duration) return;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      prog.style.width = pct + '%';
      const left = Math.max(0, Math.floor(audioEl.duration - audioEl.currentTime));
      timeEl.textContent = `-${Math.floor(left/60)}:${pad(left%60)}`;
    };
    audioEl.onended = () => {
      btn.textContent = '鈻?鎾斁褰曢煶';
      prog.style.width = '0%';
      timeEl.textContent = '';
      currentPlayingId = null;
    };

    await audioEl.play();
    btn.textContent = '鈴?鏆傚仠';
    btn.disabled = false;
    currentPlayingId = id;
  } catch (e) {
    btn.textContent = '鈻?鎾斁褰曢煶';
    btn.disabled = false;
    alert('鎾斁澶辫触锛? + e.message);
  }
}

let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function renderCalendar() {
  const el = document.getElementById('cal-grid');
  const label = document.getElementById('cal-label');
  if (!el) return;
  const yr = calYear, mo = calMonth;
  label.textContent = `${yr}骞?{mo + 1}鏈坄;

  const practicedDates = new Set(
    allSessions.filter(s => {
      const d = new Date(s.date);
      return d.getFullYear() === yr && d.getMonth() === mo;
    }).map(s => s.date)
  );

  const firstDay = new Date(yr, mo, 1).getDay();
  const daysInMonth = new Date(yr, mo + 1, 0).getDate();
  const todayStr = today();
  const weekdays = ['鏃?,'涓€','浜?,'涓?,'鍥?,'浜?,'鍏?];
  let html = weekdays.map(d => `<div class="cal-weekday">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day other-month"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === todayStr;
    const hasPractice = practicedDates.has(ds);
    const cls = ['cal-day', isToday ? 'today' : '', hasPractice ? 'has-record' : ''].filter(Boolean).join(' ');
    const dot = hasPractice ? '<div class="cal-dot"></div>' : '';
    const click = hasPractice ? `onclick="calDayClick('${ds}')"` : '';
    html += `<div class="${cls}" ${click}><span class="cal-day-num">${d}</span>${dot}</div>`;
  }
  el.innerHTML = html;
}

function calPrev() {
  calMonth--;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
}

function calNext() {
  calMonth++;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
}

function calDayClick(dateStr) {
  histFilter = 'all';
  renderHistFilter();
  renderHistList(allSessions);
  setTimeout(() => {
    const item = document.querySelector(`#hist-list .hist-item[data-date="${dateStr}"]`);
    if (item) {
      item.scrollIntoView({ behavior: 'smooth', block: 'start' });
      item.style.outline = '2px solid var(--gold)';
      setTimeout(() => item.style.outline = '', 1500);
    }

    let html = '';
    if (!hits.length) {
      html = `<div class="muted" style="text-align:center;padding:30px 0;font-size:13px;">娌℃湁鎵惧埌"${topicsSearch}"鐩稿叧棰樼洰</div>`;
    } else {
      html = hits.map(t => {
        const done = practiced.has(t.text);
        let practiceBtn = '';
        if (t._type === 'builtin') practiceBtn = `<button class="bank-item-practice" onclick="startBuiltinTopic(${t._i})">缁冧範</button>`;
        else if (t._type === 'interview') practiceBtn = `<button class="bank-item-practice" onclick="startInterviewTopic(${t._i})">缁冧範</button>`;
        else practiceBtn = `<button class="bank-item-practice" onclick="startCustomTopic(${t._i})">缁冧範</button>`;
        return `<div class="bank-item${done ? ' practiced' : ''}">
          <div class="bank-item-text">
            <span class="theme-badge">${t.theme}</span>
            <span style="display:block;margin-top:4px;">${t.text}${done ? '<span class="practiced-badge">鉁?/span>' : ''}${exBadge(t.text)}</span>
          </div>
          <div class="flex gap-6" style="flex-shrink:0;align-items:center;">
            ${noteBtn(t.text, notes)}
            ${favBtn(t.text, favs)}
            ${practiceBtn}
          </div>
          ${noteArea(t.text, notes)}
        </div>`;
      }).join('');
    }
    document.getElementById('topics-list').innerHTML = html;
    return;
  }

  // 鈹€鈹€ 娓叉煋瀛愮瓫閫?bar 鈹€鈹€
  if (topicsMainTab === 'interview') {
    // 缁村害鍒囨崲 + 鐪熼寮€鍏?
    const modeBtns = `
      <button class="filter-btn${topicsFilterMode === 'type' ? ' active' : ''}" onclick="toggleTopicsFilterMode('type')">鎸夐鍨?/button>
      <button class="filter-btn${topicsFilterMode === 'theme' ? ' active' : ''}" onclick="toggleTopicsFilterMode('theme')">鎸変富棰?/button>
    `;
    const realToggle = `<label style="display:inline-flex;align-items:center;gap:4px;margin-left:auto;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap;">
      <input type="checkbox" ${topicsRealOnly ? 'checked' : ''} onchange="toggleRealOnly()" style="accent-color:var(--gold);">
      鍙湅鐪熼
    </label>`;
    document.getElementById('topics-sub-filter').innerHTML = `<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${modeBtns}${realToggle}</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;" id="topics-sub-chips"></div>`;

    // 瀛愰€夐」 chips
    let chipsHtml = '';
    if (topicsFilterMode === 'type') {
      const subs = ['all', ...new Set(INTERVIEW_TOPICS.map(t => t.subtype))];
      const labels = { all: '鍏ㄩ儴', '缁煎悎鍒嗘瀽': '缁煎悎鍒嗘瀽', '浜洪檯鍏崇郴': '浜洪檯鍏崇郴', '璁″垝缁勭粐': '璁″垝缁勭粐', '搴旀€ュ绐?: '搴旀€ュ绐?, '鑷垜璁ょ煡': '鑷垜璁ょ煡' };
      chipsHtml = subs.map(s => `<button class="filter-btn${topicsSubFilter === s ? ' active' : ''}" onclick="topicsSubFilter='${s}';renderTopicsPage()">${labels[s]||s}</button>`).join('');
    } else {
      const themes = ['all', ...new Set(INTERVIEW_TOPICS.filter(t => t.theme).map(t => t.theme))];
      chipsHtml = themes.map(th => {
        const short = th === 'all' ? '鍏ㄩ儴' : th.replace('路', ' ');
        return `<button class="filter-btn${topicsSubFilter === th ? ' active' : ''}" onclick="topicsSubFilter='${th.replace(/'/g,"\\'")}';renderTopicsPage()">${short}</button>`;
      }).join('');
    }
    document.getElementById('topics-sub-chips').innerHTML = chipsHtml;
  } else if (topicsMainTab === 'free') {
    const themes = [...new Set(TOPICS.map(t => t.theme))];
    document.getElementById('topics-sub-filter').innerHTML = themes.map((th, i) =>
      `<button class="filter-btn${topicsSubFilter === th ? ' active' : ''}" onclick="topicsSubFilter='${th.replace(/'/g,"\\'")}';renderTopicsPage()">${th}</button>`
    ).join('');
    if (topicsSubFilter === 'all' || topicsSubFilter === '鐪熼') topicsSubFilter = themes[0] || 'all';
  } else {
    document.getElementById('topics-sub-filter').innerHTML = '';
  }

  let html = '';

  // 鈺愨晲鈺?閫氱敤 item 娓叉煋 鈹€鈹€ 涓よ甯冨眬锛氶鐩枃瀛?+ 搴曢儴 meta 鈹?鎸夐挳 鈺愨晲鈺?
  function renderItem(text, metaHtml, btnsHtml, done, noteText) {
    return `<div class="bank-item${done ? ' practiced' : ''}">
      <div class="bank-item-text">${text}${done ? '<span class="practiced-badge">鉁?/span>' : ''}${exBadge(text)}</div>
      <div class="bank-item-meta">
        <div class="bank-item-tags">${metaHtml}</div>
        <div style="display:flex;gap:4px;align-items:center;flex-shrink:0;">${btnsHtml}</div>
      </div>
      ${noteArea(noteText || text, notes)}
    </div>`;
  }

  // 鈺愨晲鈺?Tab 1: 缁撴瀯鍖栭潰璇?鈺愨晲鈺?
  if (topicsMainTab === 'interview') {
    let list = INTERVIEW_TOPICS;
    // 瀛愮瓫閫夛細鎸夐鍨?OR 鎸変富棰?
    if (topicsFilterMode === 'type') {
      if (topicsSubFilter !== 'all') list = list.filter(t => t.subtype === topicsSubFilter);
    } else {
      if (topicsSubFilter === 'all') list = list.filter(t => t.theme);
      else list = list.filter(t => t.theme === topicsSubFilter);
    }
    // 鐪熼寮€鍏?
    if (topicsRealOnly) list = list.filter(t => t.source);
    // 鎸夐鍨嬪垎缁勫睍绀?
    const subtypes = [...new Set(list.map(t => t.subtype))];
    subtypes.forEach(sub => {
      const items = list.filter(t => t.subtype === sub);
      if (!items.length) return;
      html += `<div class="interview-subtype">${sub}锛?{items.length}锛?/div>`;
      html += items.map(t => {
        const idx = INTERVIEW_TOPICS.indexOf(t);
        const done = practiced.has(t.text);
        const metaHtml = `<span class="theme-badge">${t.subtype}</span>` + (t.theme ? `<span class="bank-item-source" style="color:var(--gold);">${t.theme}</span>` : '') + (t.source ? `<span class="bank-item-source">${t.source}</span>` : '');
        const btnsHtml = `${noteBtn(t.text, notes)}${favBtn(t.text, favs)}<button class="bank-item-practice" onclick="startInterviewTopic(${idx})">缁冧範</button>`;
        return renderItem(t.text, metaHtml, btnsHtml, done, t.text);
      }).join('');
    });
    if (!list.length) html = '<div class="muted" style="text-align:center;padding:30px 0;">鏆傛棤棰樼洰</div>';
  }

  // 鈺愨晲鈺?Tab 2: 鑷敱璇濋 鈺愨晲鈺?
  else if (topicsMainTab === 'free') {
    const theme = topicsSubFilter || [...new Set(TOPICS.map(t => t.theme))][0];
    const items = TOPICS.filter(t => t.theme === theme);
    const doneCount = items.filter(t => practiced.has(t.text)).length;
    html += `<div class="bank-section-title">${theme} <span style="font-weight:400;opacity:.6;">${doneCount}/${items.length}</span></div>`;
    html += items.map(t => {
      const idx = TOPICS.indexOf(t);
      const done = practiced.has(t.text);
      const metaHtml = t.source ? `<span class="bank-item-source">${t.source}</span>` : '';
      const btnsHtml = `${noteBtn(t.text, notes)}${favBtn(t.text, favs)}<button class="bank-item-practice" onclick="startBuiltinTopic(${idx})">缁冧範</button>`;
      return renderItem(t.text, metaHtml, btnsHtml, done, t.text);
    }).join('');
  }

  // 鈺愨晲鈺?Tab 3: 鏀惰棌 鈺愨晲鈺?
  else if (topicsMainTab === 'fav') {
    if (!favs.size) {
      html = '<div class="muted" style="text-align:center;padding:40px 0;">杩樻病鏈夋敹钘忛鐩?br><span style="font-size:12px;">鐐瑰嚮棰樼洰鏃佺殑 鈽?鍗冲彲鏀惰棌</span></div>';
    } else {
      html += `<div class="bank-section-title" style="color:var(--gold);">鈽?鏀惰棌锛?{favs.size}锛?/div>`;
      const allT = [...TOPICS.map(t => ({ ...t })), ...INTERVIEW_TOPICS.map(t => ({ text: t.text, theme: '缁撴瀯鍖栭潰璇?, d: 2, subtype: t.subtype })), ...customs];
      html += [...favs].map(text => {
        const t = allT.find(x => x.text === text);
        if (!t) return '';
        const done = practiced.has(text);
        const metaHtml = `<span class="theme-badge">${t.theme || ''}</span>`;
        const btnsHtml = `${noteBtn(text, notes)}${favBtn(text, favs)}<button class="bank-item-practice" data-favtext="${text.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" onclick="startFavoriteTopic(this.dataset.favtext)">缁冧範</button>`;
        return renderItem(text, metaHtml, btnsHtml, done, text);
      }).join('');
    }
  }

  // 鈺愨晲鈺?Tab 4: 鑷畾涔?鈺愨晲鈺?
  else if (topicsMainTab === 'custom') {
    if (!customs.length) {
      html = '<div class="muted" style="text-align:center;padding:40px 0;">杩樻病鏈夎嚜瀹氫箟棰樼洰<br><span style="font-size:12px;">鐐瑰嚮鍙充笂瑙?+ 娣诲姞棰樼洰 鍗冲彲鍒涘缓</span></div>';
    } else {
      const doneCount = customs.filter(t => practiced.has(t.text)).length;
      html += `<div class="bank-section-title">鑷畾涔夐鐩?<span style="font-weight:400;opacity:.6;">${doneCount}/${customs.length}</span></div>`;
      html += customs.map((t, i) => {
        const done = practiced.has(t.text);
        const metaHtml = `<span class="theme-badge">${t.theme}</span>`;
        const btnsHtml = `${noteBtn(t.text, notes)}${favBtn(t.text, favs)}<button class="bank-item-practice" onclick="startCustomTopic(${i})">缁冧範</button><button class="bank-item-del" onclick="deleteCustomTopic(${i})">鍒?/button>`;
        return renderItem(t.text, metaHtml, btnsHtml, done, t.text);
      }).join('');
    }
  }

  document.getElementById('topics-list').innerHTML = html;
}

function startInterviewTopic(idx) {
  const t = INTERVIEW_TOPICS[idx];
  if (!t) return;
  S.topic = { text: t.text, theme: '缁撴瀯鍖栭潰璇?, subtype: t.subtype, d: 2 };
  S.mode = 'topic';
  goReady();
}

function startBuiltinTopic(idx) {
  const t = TOPICS[idx];
  if (!t) return;
  S.topic = t;
  S.mode = 'topic';
  goReady();
}

function startCustomTopic(i) {
  const customs = loadCustomTopics();
  const t = customs[i];
  if (!t) return;
  S.topic = { text: t.text, theme: t.theme, d: t.d || 2 };
  S.mode = 'topic';
  goReady();
}

function topicsScrollTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const tabBar = document.getElementById('topics-tab-bar');
  const offset = tabBar ? tabBar.offsetHeight + 8 : 0;
  const top = el.getBoundingClientRect().top + window.scrollY - offset;
  window.scrollTo({ top, behavior: 'smooth' });
}

function showAddTopic() {
  document.getElementById('add-topic-box').style.display = 'flex';
  document.getElementById('new-topic-text').value = '';
  document.getElementById('new-topic-theme').value = '';
  // 娓叉煋涓婚閫夋嫨 chips
  const themes = [...new Set(TOPICS.map(t => t.theme)), '缁撴瀯鍖栭潰璇?];
  document.getElementById('new-topic-theme-chips').innerHTML = themes.map(th =>
    `<button type="button" class="preset-btn" onclick="selectNewTheme('${th}', this)">${th}</button>`
  ).join('');
}

function selectNewTheme(theme, btn) {
  document.getElementById('new-topic-theme').value = theme;
  document.querySelectorAll('#new-topic-theme-chips .preset-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function hideAddTopic() {
  document.getElementById('add-topic-box').style.display = 'none';
}

function saveNewTopic() {
  const text = document.getElementById('new-topic-text').value.trim();
  const theme = document.getElementById('new-topic-theme').value.trim() || '鑷畾涔?;
  if (!text) {
    document.getElementById('new-topic-text').style.borderColor = 'var(--red)';
    return;
  }
  document.getElementById('new-topic-text').style.borderColor = 'var(--border)';
  const customs = loadCustomTopics();
  customs.push({ text, theme, d: 2 });
  saveCustomTopics(customs);
  hideAddTopic();
  renderTopicsPage();
}

function deleteCustomTopic(i) {
  if (!confirm('鍒犻櫎杩欓亾鑷畾涔夐鐩紵')) return;
  const customs = loadCustomTopics();
  customs.splice(i, 1);
  saveCustomTopics(customs);
  renderTopicsPage();
}

/* 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?
   BOOT
鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺?*/
init();
</script>
